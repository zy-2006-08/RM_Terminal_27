# 真机配置模板：连官方裁判系统（比赛时的官方服务器，或者测试时当服务器的 26 赛事引擎选手端电脑）。
# scripts/install_ubuntu.sh 第一次运行时把它复制到 ~/rm_terminal.26engine.conf，桌面上的「RM 真机」读那一份。
# 要改就改主文件夹里那份，这份模板不用动。每一项的意思见 rm_terminal.conf.sample，
# 地址和协议见 docs/guides/用26赛事引擎测试终端-宝宝教程.md 第 7 节。
mqtt_host=192.168.12.1
mqtt_port=3333
udp_port=3334
# 必须和官方选手端登录的机器人一致：登录 R3 就填 3。点「RM 真机」时弹窗选的席位会盖过这一行。
self_robot_id=3
log_level=debug
# 自定义控制器：auto = 自己找插着的、在发控制器数据的串口，换串口板不用改。
# 这台电脑没接控制器就删掉这一行，「控制器」灯显示「未启用」。
controller_serial=auto
