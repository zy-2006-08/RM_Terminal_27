# 这是队内统一真机配置（提交进仓库，所有人共用，不要每台电脑改）。
# 各项的完整说明和可选键见 rm_terminal.conf.sample（现场参考模板）。
# 改这份要在仓库里改，然后 commit / pull，全队就都更新了。

# 官方裁判系统服务器（2027 协议）。
mqtt_host=192.168.12.1
mqtt_port=3333

# 图传接收端口（2027 协议）。
udp_port=3334

log_level=info

# 自定义控制器串口自动识别，换 USB 线不用改配置。
controller_serial=auto

# 10.27.0.6 是队内约定的指挥手第二张网卡 IP（计划变了改这一行）。
# 地面席位把图传原样转发到这里；指挥手席位/回放时该转发会自动忽略，
# 所以全队共用这一份配置就行。
video_relay_host=10.27.0.6

# 这份配置里不写的东西：
#   席位由启动器弹窗传 --seat；
#   显示器由启动器自适应选择（--fullscreen / --display-screen）。
